name: Feature Request
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出产品改进建议。请先说明使用场景，再描述期望方案。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 可以是交互流程、页面入口、API 行为或配置方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如有其他可行路径，请一并说明。
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可多选）
      options:
        - label: 加班计算 / 节假日规则
        - label: Excel / 截图导入
        - label: Dashboard / 报表
        - label: AI 总结 / 问答
        - label: 账号 / 权限 / 分享
        - label: 部署 / 文档
